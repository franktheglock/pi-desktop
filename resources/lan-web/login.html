<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0a" />
  <title>Pi Desktop — LAN Login</title>
  <link rel="stylesheet" href="/login.css" />
</head>
<body>
  <main class="card">
    <div class="logo">π</div>
    <h1>Pi Desktop Remote</h1>
    <p class="muted">Same full app as the desktop. Enter the token from Settings → LAN Remote.</p>
    <label>
      <span>Access token</span>
      <input id="token" type="password" autocomplete="current-password" placeholder="Paste token" />
    </label>
    <button id="go" type="button">Open app</button>
    <p id="err" class="error" hidden></p>
  </main>
  <script src="/login.js"></script>
</body>
</html>
